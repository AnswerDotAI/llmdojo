[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llmdojo"
dynamic = ["version"]
description = "Retired: its commands moved to llmsurgery and aai-coding"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{name = "Jeremy Howard", email = "info@fast.ai"}]
keywords = ['nbdev']
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = []

[project.urls]
Repository = "https://github.com/AnswerDotAI/llmdojo"
Documentation = "https://AnswerDotAI.github.io/llmdojo/"

[project.entry-points.nbdev]
llmdojo = "llmdojo._modidx:d"

[tool.setuptools.dynamic]
version = {attr = "llmdojo.__version__"}

[tool.setuptools.packages.find]
include = ["llmdojo*"]

[tool.chkstyle]
skip_paths = ["_modidx.py"]

[tool.nbdev]
